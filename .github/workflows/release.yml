name: Release Registry image

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Test Registry
        # Race-instrumented SQLite migrations must not compete across packages
        # with their fixed production bootstrap deadline.
        run: go test -race -p 1 ./...
      - name: Build exact tagged source
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          printf 'RELEASE_VERSION=%s\nRELEASE_IMAGE=%s\n' "$version" "$image" >> "$GITHUB_ENV"
          docker build --build-arg "MYSCOUTEE_VERSION=$version" --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$image" .
      - name: Publish and verify image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          built_id="$(docker image inspect --format '{{.Id}}' "$RELEASE_IMAGE")"
          docker push "$RELEASE_IMAGE"
          docker pull "$RELEASE_IMAGE"
          [[ "$(docker image inspect --format '{{.Id}}' "$RELEASE_IMAGE")" == "$built_id" ]]
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$RELEASE_IMAGE")"
          {
            printf 'Shared Registry adapter **%s** (Linux amd64).\n\n' "$RELEASE_VERSION"
            printf 'Image: `%s`\n\nPinned image: `%s`\n\n' "$RELEASE_IMAGE" "$digest"
            printf 'Source: `%s`. Go race tests passed.\n\n' "$GITHUB_SHA"
            printf 'Version is embedded in the Registry binary. Persist operator data outside the image.\n'
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "MyScoutee Registry $RELEASE_VERSION" --notes-file release-notes.md
