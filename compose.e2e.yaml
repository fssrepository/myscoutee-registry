# Disposable standalone E2E Registry; backend E2E uses its own isolated model.
name: myscoutee-registry-e2e

services:
  registry:
    extends:
      file: compose.dev.yaml
      service: registry
    image: ${REGISTRY_E2E_IMAGE:-myscoutee-registry:1.3.0-e2e}
    restart: "no"
    ports: !override
      - "127.0.0.1:${REGISTRY_E2E_PORT:-18081}:8080"
    environment:
      REGISTRY_SCOPE: "demo:myscoutee"
      REGISTRY_DATABASE_PATH: "/data/e2e-demo-registry.db"
      REGISTRY_SIGNING_KEY_PATH: "/data/e2e-demo-signing-key.pem"
      REGISTRY_GENERATE_SIGNING_KEY: "true"
      REGISTRY_GLOBAL_IDENTITY_VOPRF_KEYRING_PATH: "/data/e2e-demo-global-identity-voprf-keyring.json"
      REGISTRY_GENERATE_GLOBAL_IDENTITY_VOPRF_KEY: "true"
    volumes:
      - registry-e2e-data:/data

volumes:
  registry-e2e-data:
