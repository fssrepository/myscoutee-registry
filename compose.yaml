services:
  # This is the isolated server-backed Explore/demo registry. start-demo is
  # fail-closed, requires the explicit guard and demo scope/path names, and
  # creates its baseline only through the normal signed service methods.
  registry:
    build:
      context: .
    image: ${LOCAL_REGISTRY_IMAGE:-myscoutee-registry:1.3.0-dev}
    restart: unless-stopped
    command: ["start-demo"]
    ports:
      - "${REGISTRY_BIND_ADDRESS:-127.0.0.1}:${REGISTRY_PORT:-8081}:8080"
    environment:
      REGISTRY_LISTEN_ADDR: ":8080"
      REGISTRY_SCOPE: "${REGISTRY_SCOPE:-demo:myscoutee}"
      REGISTRY_DATABASE_PATH: "/data/registry-demo.db"
      REGISTRY_SIGNING_KEY_PATH: "/data/registry-demo-signing-key.pem"
      REGISTRY_GENERATE_SIGNING_KEY: "${REGISTRY_GENERATE_SIGNING_KEY:-true}"
      REGISTRY_GLOBAL_IDENTITY_VOPRF_KEYRING_PATH: "/data/registry-demo-global-identity-voprf-keyring.json"
      REGISTRY_GENERATE_GLOBAL_IDENTITY_VOPRF_KEY: "${REGISTRY_GENERATE_GLOBAL_IDENTITY_VOPRF_KEY:-true}"
      REGISTRY_DEMO_SEED: "true"
      REGISTRY_TIMESTAMP_SKEW: "${REGISTRY_TIMESTAMP_SKEW:-5m}"
      REGISTRY_CHECKPOINT_INTERVAL: "${REGISTRY_CHECKPOINT_INTERVAL:-1m}"
      REGISTRY_VALUATION_MULTIPLIER_BASIS_POINTS: "${REGISTRY_VALUATION_MULTIPLIER_BASIS_POINTS:-30000}"
      REGISTRY_HEALTHCHECK_URL: "http://127.0.0.1:8080/healthz"
    volumes:
      - registry-demo-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s

volumes:
  registry-demo-data:
