services:
  registry:
    build:
      context: .
    image: ${LOCAL_REGISTRY_IMAGE:-myscoutee-registry:1.0.0-dev}
    restart: unless-stopped
    ports:
      - "${REGISTRY_BIND_ADDRESS:-127.0.0.1}:${REGISTRY_PORT:-8081}:8080"
    environment:
      REGISTRY_LISTEN_ADDR: ":8080"
      REGISTRY_SCOPE: "${REGISTRY_SCOPE:?set an explicit registry scope}"
      REGISTRY_DATABASE_PATH: "/data/registry.db"
      REGISTRY_SIGNING_KEY_PATH: "/data/registry-signing-key.pem"
      REGISTRY_GENERATE_SIGNING_KEY: "${REGISTRY_GENERATE_SIGNING_KEY:-true}"
      REGISTRY_TIMESTAMP_SKEW: "${REGISTRY_TIMESTAMP_SKEW:-5m}"
      REGISTRY_CHECKPOINT_INTERVAL: "${REGISTRY_CHECKPOINT_INTERVAL:-1m}"
      REGISTRY_HEALTHCHECK_URL: "http://127.0.0.1:8080/healthz"
    volumes:
      - registry-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s

volumes:
  registry-data:
